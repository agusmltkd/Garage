name: Precios de carburante

on:
  schedule:
    # 06:15 y 15:15 UTC = 08:15 y 17:15 en Espana (horario de verano)
    - cron: '15 6 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar precios
        env:
          # Andalucia entera. Quita o anade las que quieras:
          # 04 Almeria, 11 Cadiz, 14 Cordoba, 18 Granada,
          # 21 Huelva, 23 Jaen, 29 Malaga, 41 Sevilla
          PROVINCIAS: '41,29,11,21,14,18,23,04'
          DESTINO: 'datos/gasolineras.json'
          # El Ministerio bloquea las direcciones de GitHub. Pon aqui la URL de
          # tu Worker de Cloudflare (sin barra final) y la descarga pasa por el.
          PROXY: 'https://carburante.TU-USUARIO.workers.dev'
          PYTHONUNBUFFERED: '1'
        run: python scripts/gasolineras.py

      - name: Publicar si ha cambiado
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add datos/
          if git diff --staged --quiet; then
            echo "Los precios no han cambiado, no hago commit."
            exit 0
          fi

          git commit -m "Precios de carburante $(date -u +'%Y-%m-%d %H:%M UTC')"

          # el repositorio puede haber cambiado mientras corria la tarea,
          # asi que reintentamos reincorporando lo que haya llegado
          for intento in 1 2 3; do
            if git push; then
              echo "Publicado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado (intento $intento). Traigo lo nuevo y reintento."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              echo "El rebase ha fallado, lo deshago."
              git rebase --abort || true
            }
            sleep $((intento * 4))
          done

          echo "No he conseguido publicar despues de 3 intentos."
          exit 1

      - name: Que ha quedado
        if: always()
        run: |
          echo "--- contenido de datos/ ---"
          ls -la datos/ 2>/dev/null || echo "(no existe la carpeta datos)"
          echo "--- ultimo commit ---"
          git log -1 --oneline || true
