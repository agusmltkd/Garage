<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garaje</title>
<meta name="description" content="Gestión de gastos, mantenimiento y ficha técnica de tu coche.">
<meta name="theme-color" content="#15181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garaje">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15181B; --bg2:#1B1F23; --panel:#21262B; --panel2:#272D33; --panel3:#2E353C;
  --line:#333B42; --line2:#3E474F;
  --txt:#ECEAE5; --dim:#909AA2; --dim2:#69737B;
  --amber:#E5A93F; --eco:#79C08D; --perf:#E0563C; --blue:#5B8FC7;
  --accent:var(--amber); --accent-soft:rgba(229,169,63,.14);
  --ok:#79C08D; --warn:#E5A93F; --bad:#E0563C;
  --r:14px; --r2:10px;
  --disp:"Barlow Condensed","Oswald","Helvetica Neue",system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-tema="eco"]{--accent:var(--eco);--accent-soft:rgba(121,192,141,.14)}
[data-tema="perf"]{--accent:var(--perf);--accent-soft:rgba(224,86,60,.14)}
[data-tema="blue"]{--accent:var(--blue);--accent-soft:rgba(91,143,199,.16)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%,#20262C 0%,var(--bg) 62%);
  background-attachment:fixed;
  color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent);color:#14171A}

/* ---------- tipografia ---------- */
.eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim2)}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:.01em;line-height:1.1}
h2{font-size:22px}h3{font-size:17px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---------- matricula ---------- */
.plate{display:inline-flex;align-items:stretch;background:#F2F2EE;border-radius:5px;
  overflow:hidden;border:1px solid #0C0E10;box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.15);
  height:36px;flex:0 0 auto}
.plate .eu{background:#123A96;color:#F5C518;width:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding-bottom:2px;font-family:var(--disp);
  font-size:12px;font-weight:700;line-height:1}
.plate .eu i{font-style:normal;font-size:7px;letter-spacing:-1px;opacity:.95;margin-bottom:1px}
.plate .n{display:flex;align-items:center;padding:0 10px 0 9px;color:#101215;
  font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.06em;white-space:nowrap}
.plate.sm{height:28px}.plate.sm .n{font-size:18px;padding:0 8px}.plate.sm .eu{width:16px;font-size:10px}
.plate.lg{height:52px}.plate.lg .n{font-size:34px;padding:0 14px}.plate.lg .eu{width:28px;font-size:16px}

/* ---------- layout ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(21,24,27,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + var(--safe-t)) 16px 10px 16px}
.top-in{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
.top .id{min-width:0;flex:1}
.top .id .who{font-family:var(--disp);font-size:13px;color:var(--dim);letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odo{text-align:right;line-height:1;padding:2px 4px;border-radius:8px}
.odo:hover{background:rgba(255,255,255,.04)}

/* documentos */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:620px){.docs{grid-template-columns:repeat(5,1fr)}}
.doc{display:block;text-align:left;border:1px solid var(--line);border-radius:var(--r2);
  overflow:hidden;background:var(--bg2)}
.doc img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--panel3)}
.doc span{display:block;padding:6px 7px;font-size:11.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc:hover{border-color:var(--accent)}
.odo b{font-family:var(--disp);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.odo span{display:block;font-size:10px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;font-family:var(--disp)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);background:var(--panel)}
.iconbtn:hover{color:var(--txt);border-color:var(--line2)}
.iconbtn svg{width:17px;height:17px}

main{max-width:1080px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b));}
section.view{display:none;animation:fade .22s ease}
section.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(24,28,32,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-b))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 1px;color:var(--dim2);font-family:var(--disp);font-size:10px;
  letter-spacing:.05em;text-transform:uppercase;border-radius:10px;white-space:nowrap}
.tabs button svg{width:19px;height:19px}

/* mapa de gasolineras */
.mapa{height:280px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  margin-bottom:14px;background:var(--panel);
  /* Leaflet apila sus capas hasta z-index 1000; con esto se quedan
     encerradas aqui dentro y no tapan la hoja ni las pestanas */
  position:relative;z-index:0;isolation:isolate}
.mapa:empty{display:none}
.leaflet-container{background:var(--bg2)!important;font-family:var(--body)}
/* OpenStreetMap solo sirve mapa claro: lo invertimos para que pegue con la app.
   El filtro va sobre las teselas, asi que no toca los marcadores de precio. */
.leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.75)}
.leaflet-control-attribution{background:rgba(21,24,27,.75)!important;color:var(--dim2)!important;
  font-size:9px!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.pin{font-family:var(--disp);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  text-align:center;line-height:20px;height:20px;border-radius:10px;color:#14171A;
  box-shadow:0 2px 6px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.35)}
.pin.ok{background:#79C08D}.pin.warn{background:#E5A93F}.pin.bad{background:#E0563C}
.tabs button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(76px + var(--safe-b));z-index:46;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#14171A;
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.5);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}

/* ---------- tarjetas ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.tight{padding:12px 14px}
.card h3{margin-bottom:2px}
.card .sub{color:var(--dim);font-size:13px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.hd .act{font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

/* cuadro de mandos */
.cluster{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.cell{background:linear-gradient(180deg,var(--panel2),var(--panel));padding:14px 14px 12px}
.cell .k{font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.cell .v{font-family:var(--disp);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;
  line-height:1.05;margin-top:4px;color:var(--txt)}
.cell .v small{font-size:14px;color:var(--dim);font-weight:500;margin-left:3px}
.cell .d{font-size:12px;color:var(--dim);margin-top:2px}
.cell.hi .v{color:var(--accent)}
@media(min-width:620px){.cluster{grid-template-columns:repeat(4,1fr)}}

/* listas */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;flex:0 0 auto}
.row .ic svg{width:17px;height:17px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--dim)}
.row .amt{font-family:var(--disp);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt em{display:block;font-style:normal;font-size:11px;color:var(--dim);text-align:right;font-family:var(--body)}
.row.tap{cursor:pointer}.row.tap:hover{background:rgba(255,255,255,.02)}

/* estado / semaforo */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;
  border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.pill.mut{color:var(--dim2)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .5s ease}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}

/* formularios */
label.f{display:block;margin-bottom:12px}
label.f .l{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r2);padding:10px 12px;font-size:15px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=date]{-webkit-appearance:none;min-height:42px}
textarea{resize:vertical;min-height:70px;font-family:var(--body)}
select{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23909AA2' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:400px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:11px 16px;border-radius:var(--r2);border:1px solid var(--line2);color:var(--txt);width:100%}
.btn.pri{background:var(--accent);color:#14171A;border-color:transparent}
.btn.gh{border-color:var(--line)}
.btn.dan{color:var(--bad);border-color:rgba(224,86,60,.4)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btnrow{display:flex;gap:10px;margin-top:6px}

/* hoja modal */
.scrim{position:fixed;inset:0;background:rgba(8,10,12,.66);z-index:1200;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1201;max-height:92vh;
  background:var(--bg2);border-top:1px solid var(--line2);
  border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column}
.sheet.on{transform:none}
@media(min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:600px;max-height:88vh;
    border-radius:18px;border:1px solid var(--line2);
    transform:translate(-50%,-44%) scale(.97);opacity:0;transition:opacity .2s,transform .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1}
.sheet .sb{overflow-y:auto;padding:16px 18px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
@media(min-width:700px){.grab{display:none}}

/* ficha tecnica */
.spec{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.spec:last-child{border-bottom:0}
.spec .k{color:var(--dim);font-size:13.5px;flex:0 0 auto;max-width:52%}
.spec .v{text-align:right;font-weight:500;word-break:break-word}
.spec .v.mono{font-family:var(--disp);letter-spacing:.06em;font-size:16px}
.empty{color:var(--dim2);font-style:italic;font-weight:400}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  font-family:var(--disp);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.chip.on{background:var(--accent);color:#14171A;border-color:transparent}

/* graficos */
.chart{width:100%;height:150px;display:block;overflow:visible}
.chart text{font-family:var(--disp);font-size:10px;fill:var(--dim2);letter-spacing:.08em}
.blank{text-align:center;padding:26px 10px;color:var(--dim)}
.blank p{margin:6px auto 14px;max-width:34ch;font-size:14px}
.blank .big{font-family:var(--disp);font-size:19px;color:var(--txt)}

/* presiones neumaticos */
.tyres{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tyre{border:1px solid var(--line2);border-radius:8px;padding:8px;text-align:center;background:var(--panel)}
.tyre .p{font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.tyre .u{font-size:10px;letter-spacing:.14em;color:var(--dim2);font-family:var(--disp);text-transform:uppercase}
.axle{width:26px;height:2px;background:var(--line2);position:relative}
.tyres .lbl{grid-column:1/-1;text-align:center;font-family:var(--disp);font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);
  background:var(--panel3);border:1px solid var(--line2);color:var(--txt);padding:10px 16px;
  border-radius:10px;z-index:1300;opacity:0;transition:.25s;font-size:14px;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--dim2);line-height:1.5}
.sep{height:1px;background:var(--line);margin:16px 0}
.right{text-align:right}.dim{color:var(--dim)}
.accent{color:var(--accent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="plate sm" id="plateBtn" title="Cambiar de coche">
      <span class="eu"><i>★★★<br>★★★</i>E</span><span class="n" id="plateNum">0000 XC6</span>
    </button>
    <div class="id"><div class="who" id="whoTxt">Volvo XC60</div></div>
    <button class="odo" id="odoBtn" title="Actualizar odómetro"><b class="num" id="odoVal">—</b><span>km</span></button>
    <button class="iconbtn" id="menuBtn" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="view on" id="v-resumen"></section>
  <section class="view" id="v-repostajes"></section>
  <section class="view" id="v-precios"></section>
  <section class="view" id="v-gastos"></section>
  <section class="view" id="v-taller"></section>
  <section class="view" id="v-ficha"></section>
</main>

<button class="fab" id="fab" aria-label="Añadir registro">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" id="tabs">
  <button data-t="resumen" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l3.5-4.5"/><path d="M3.5 17a9 9 0 1117 0"/><circle cx="12" cy="14" r="1.4"/></svg>
    <span>Cuadro</span></button>
  <button data-t="repostajes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6a2 2 0 012-2h6a2 2 0 012 2v14"/><path d="M3 20h12"/><path d="M14 9h3a2 2 0 012 2v5a1.5 1.5 0 003 0V9l-2.5-3"/><path d="M6.5 8h5"/></svg>
    <span>Repostajes</span></button>
  <button data-t="precios">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
    <span>Precios</span></button>
  <button data-t="gastos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 015.5 6h13A2.5 2.5 0 0121 8.5v7A2.5 2.5 0 0118.5 18h-13A2.5 2.5 0 013 15.5z"/><path d="M3 10.5h18"/><path d="M7 14.5h3"/></svg>
    <span>Gastos</span></button>
  <button data-t="taller">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5a4.5 4.5 0 00-5.9 5.9l-4.2 4.2a2 2 0 102.8 2.8l4.2-4.2a4.5 4.5 0 005.9-5.9l-2.4 2.4-2.1-.5-.5-2.1z"/></svg>
    <span>Taller</span></button>
  <button data-t="ficha">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
    <span>Ficha</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh"><h2 id="sheetTitle">—</h2>
    <button class="iconbtn" id="sheetClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sb" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===================== ESTADO ===================== */
const VERSION = '12 · 26/08/2026';
const KEY = 'garaje.v1';

/* ===================== UTILIDADES ===================== */
const n2 = v => (v==null||v==='')?null:Number(String(v).replace(',','.'));
function eur(v,d){ if(v==null||isNaN(v)) return '—';
  return v.toLocaleString('es-ES',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})+' €'; }
function num(v,d){ if(v==null||isNaN(v)) return '—';
  return v.toLocaleString('es-ES',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function fFecha(s){ if(!s) return '—'; const p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fCorta(s){ if(!s) return '—'; const d=new Date(s+'T12:00');
  return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }
function dias(a,b){ return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000); }
function sumaMeses(f,m){ const d=new Date(f+'T12:00'); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* odometro: lectura del cuadro + los km recorridos apuntados despues de esa fecha */
function kmActual(){
  const c = coche();
  const base = n2(c.kmManual), bf = c.kmManualFecha || '';
  let m = 0;
  if(base){
    m = base + mios(DB.repostajes)
      .filter(r => !bf || (r.fecha && r.fecha > bf))
      .reduce((s,r) => s + (n2(r.trip)||0), 0);
  }
  const push = r => { const k=n2(r.km); if(k && k>m) m=k; };
  mios(DB.repostajes).forEach(push); mios(DB.gastos).forEach(push);
  mios(DB.mantenimientos).forEach(push); mios(DB.averias).forEach(push);
  return m || null;
}
function odometroCalculado(){ return !!(n2(coche().kmManual)); }

/* precio de referencia para estimar litros cuando solo hay importe */
function precioRef(){ return n2(DB.precioRef) || 1.5; }

/* litros de un repostaje: los apuntados, o estimados desde el importe */
function litrosDe(r){
  const l = n2(r.litros);
  if(l) return {l, est:false};
  const t = n2(r.total), p = n2(r.precioL);
  if(t && p) return {l:t/p, est:false};
  if(t) return {l:t/precioRef(), est:true};
  return {l:null, est:false};
}

/* consumo: por km recorridos si los hay, si no entre depositos llenos */
function consumos(){
  const rs = mios(DB.repostajes).slice().sort((a,b)=> (a.fecha+a.id) < (b.fecha+b.id) ? -1 : 1);
  const out = [];
  let ancla = null, acumL = 0, acumE = 0, acumEst = false;
  rs.forEach(r=>{
    const km = n2(r.km), trip = n2(r.trip), L = litrosDe(r), tot = n2(r.total) || 0;
    if(trip && L.l){
      out.push({id:r.id, fecha:r.fecha, km, dist:trip, litros:L.l, coste:tot,
        l100: L.l*100/trip, eur100: tot ? tot*100/trip : null, est:L.est});
      if(km) ancla = {km};
      acumL = 0; acumE = 0; acumEst = false;
      return;
    }
    if(ancla && km && km > ancla.km){
      acumL += L.l || 0; acumE += tot; acumEst = acumEst || L.est;
      if(r.lleno){
        const d = km - ancla.km;
        out.push({id:r.id, fecha:r.fecha, km, dist:d, litros:acumL, coste:acumE,
          l100: acumL*100/d, eur100: acumE ? acumE*100/d : null, est:acumEst});
        ancla = {km}; acumL = 0; acumE = 0; acumEst = false;
      }
    } else if(r.lleno && km){ ancla = {km}; acumL = 0; acumE = 0; acumEst = false; }
  });
  /* aviso: un repostaje que se pasa un 15% de la mediana de los 6 anteriores */
  out.forEach((o,i)=>{
    const prev = out.slice(Math.max(0,i-6), i).map(x=>x.l100);
    if(prev.length >= 4){
      const md = mediana(prev);
      o.ref = md;
      o.exceso = (o.l100 - md) * 100 / md;
      o.alerta = o.exceso > 15;
    }
  });
  return out;
}
function mediana(a){
  if(!a.length) return null;
  const b = a.slice().sort((x,y)=>x-y), m = b.length>>1;
  return b.length % 2 ? b[m] : (b[m-1]+b[m])/2;
}

/* km recorridos totales: por odometro si lo hay, si no sumando trayectos */
function kmRecorridos(){
  const km = kmActual(), kc = n2(coche().kmCompra);
  if(km && kc!=null && km > kc) return km - kc;
  const t = mios(DB.repostajes).reduce((s,r)=> s + (n2(r.trip)||0), 0);
  return t || null;
}
function media(a){ return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; }
/* medias reales: litros totales entre km totales, no promedio de promedios */
function pondL(cs){ const d = cs.reduce((s,x)=>s+x.dist,0), l = cs.reduce((s,x)=>s+x.litros,0);
  return d ? l*100/d : null; }
function pondE(cs){ const d = cs.reduce((s,x)=>s+x.dist,0), e = cs.reduce((s,x)=>s+(x.coste||0),0);
  return (d && e) ? e*100/d : null; }

/* estado de cada punto del plan de mantenimiento */
function estadoPlan(){
  const km = kmActual();
  return plan().map(p=>{
    const hist = mios(DB.mantenimientos).filter(m=>m.tipo===p.id)
                 .sort((a,b)=> a.fecha<b.fecha?1:-1);
    const ult = hist[0] || null;
    const uf = ult ? ult.fecha : (p.ult||null);
    const uk = ult ? n2(ult.km) : (p.ultKm?n2(p.ultKm):null);
    let dKm=null, dDias=null, prox=null, proxKm=null;
    if(p.km && uk){ proxKm = uk + p.km; dKm = proxKm - (km||uk); }
    if(p.meses && uf){ prox = sumaMeses(uf,p.meses); dDias = dias(hoy(), prox); }
    let pc = null;
    if(p.km && uk && km) pc = Math.min(100, Math.max(0,(km-uk)*100/p.km));
    if(p.meses && uf){ const t=dias(uf,sumaMeses(uf,p.meses)), e=dias(uf,hoy());
      const pm = Math.min(100,Math.max(0,e*100/t)); pc = pc==null?pm:Math.max(pc,pm); }
    let est='mut';
    if(pc!=null){ est = pc>=100?'bad' : pc>=85?'warn' : 'ok'; }
    if((dDias!=null&&dDias<0)||(dKm!=null&&dKm<0)) est='bad';
    return Object.assign({},p,{uf,uk,dKm,dDias,prox,proxKm,pc,est,n:p.n});
  });
}

function sparkline(datos, fmt, unidad){
  if(datos.length < 2) return '';
  const W=320, H=118, pl=6, pr=6, pt=14, pb=20;
  const ys = datos.map(d=>d.y);
  let mn = Math.min.apply(null,ys), mx = Math.max.apply(null,ys);
  if(mx===mn){ mx+=1; mn-=1; }
  const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const X = i => pl + i*(W-pl-pr)/(datos.length-1);
  const Y = v => pt + (mx-v)*(H-pt-pb)/(mx-mn);
  let d='', a='';
  datos.forEach((p,i)=>{ const x=X(i).toFixed(1), y=Y(p.y).toFixed(1);
    d += (i?' L':'M')+x+' '+y; a += (i?' L':'M')+x+' '+y; });
  a += ' L'+X(datos.length-1).toFixed(1)+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z';
  const avg = media(ys), ya = Y(avg).toFixed(1);
  const pts = datos.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(p.mal?3.6:2.6)+'" fill="'+(p.mal?'var(--bad)':'var(--accent)')+'"/>').join('');
  const ult = datos[datos.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/>'+
    '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+a+'" fill="url(#gA)"/>'+
    '<line x1="0" y1="'+ya+'" x2="'+W+'" y2="'+ya+'" stroke="var(--line2)" stroke-dasharray="3 4"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    pts+
    '<text x="2" y="'+(H-6)+'">'+esc(datos[0].x)+'</text>'+
    '<text x="'+(W-2)+'" y="'+(H-6)+'" text-anchor="end">'+esc(ult.x)+'</text>'+
    '</svg>';
}
function barras(items){
  if(!items.length) return '';
  const mx = Math.max.apply(null, items.map(i=>i.v)) || 1;
  return '<div style="margin-top:4px">'+items.map(i=>
    '<div style="margin-bottom:9px">'+
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">'+
        '<span>'+esc(i.n)+'</span><span class="num" style="font-size:15px">'+eur(i.v,0)+'</span></div>'+
      '<div class="bar"><i style="width:'+(i.v*100/mx).toFixed(1)+'%;background:var(--accent)"></i></div>'+
    '</div>').join('')+'</div>';
}

/* ===================== VISTA: CUADRO ===================== */
function vResumen(){
  const c = coche(), km = kmActual(), cs = consumos();
  const l100 = pondL(cs.slice(-5)), l100t = pondL(cs);
  const anio = new Date().getFullYear();
  const gAnio = mios(DB.gastos).filter(g=>g.fecha.startsWith(anio)).reduce((s,g)=>s+(n2(g.importe)||0),0);
  const rAnio = mios(DB.repostajes).filter(g=>g.fecha.startsWith(anio)).reduce((s,g)=>s+(n2(g.total)||0),0);
  const totalTodo = mios(DB.gastos).reduce((s,g)=>s+(n2(g.importe)||0),0)
                  + mios(DB.repostajes).reduce((s,g)=>s+(n2(g.total)||0),0);
  const recorridos = kmRecorridos();
  const cKm = (recorridos && recorridos>0) ? totalTodo/recorridos : null;
  const estimado = cs.length && cs.slice(-5).every(x=>x.est);
  const eur100 = pondE(cs.slice(-5));
  /* tendencia: ultimos 6 repostajes contra los 6 anteriores */
  const t1 = cs.length>=12 ? pondL(cs.slice(-6)) : null, t0 = cs.length>=12 ? pondL(cs.slice(-12,-6)) : null;
  const tend = (t1 && t0) ? (t1-t0)*100/t0 : null;
  const pieConsumo = tend!=null
    ? (tend>0?'+':'')+num(tend,0)+'% frente a los 6 anteriores'
    : (l100t?('Histórico '+num(l100t,1)+(estimado?' · estimado':'')):'Apunta los km recorridos');

  let h = '<div class="cluster">'+
    cell('Consumo medio', l100?(estimado?'≈':'')+num(l100,1):'—','L/100 km', pieConsumo, true)+
    cell('Coste combustible', eur100?num(eur100,1):'—','€/100 km', 'de tus últimos repostajes')+
    cell('Gasto '+anio, num(gAnio+rAnio,0),'€', 'Combustible '+num(rAnio,0)+' € · Otros '+num(gAnio,0)+' €')+
    cell('Coste por km', cKm?num(cKm,3):'—','€/km', recorridos?(num(recorridos)+' km registrados'):'Apunta los km recorridos')+
  '</div>';

  /* avisos */
  const ultC = cs[cs.length-1];
  if(ultC && ultC.alerta){
    h += '<div class="card tight" style="border-color:rgba(224,86,60,.45)">'+
      '<div class="row" style="padding:4px 0"><div class="ic" style="background:rgba(224,86,60,.14);color:var(--bad)">'+ico('alert')+'</div>'+
      '<div class="main"><div class="t">El último repostaje se ha ido un '+num(ultC.exceso,0)+'%</div>'+
      '<div class="s">'+num(ultC.l100,1)+' L/100 km frente a '+num(ultC.ref,1)+' de tus seis anteriores. '+
      'Puede ser el tipo de trayecto, la presión de las ruedas o algo que revisar.</div></div></div></div>';
  }
  if(!odometroCalculado()){
    h += '<div class="card tight"><div class="row tap" id="pedirOdo" style="padding:4px 0">'+
      '<div class="ic">'+ico('chip')+'</div><div class="main"><div class="t">Dime los kilómetros del cuadro</div>'+
      '<div class="s">Una sola vez. Después los sumo yo con cada repostaje y se activan los avisos por kilómetros.</div></div></div></div>';
  }

  /* vencimientos */
  const ven = estadoPlan().filter(p=>p.pc!=null).sort((a,b)=>{
    const A = a.dDias!=null?a.dDias:9999, B = b.dDias!=null?b.dDias:9999;
    const Ak = a.dKm!=null?a.dKm/50:9999, Bk = b.dKm!=null?b.dKm/50:9999;
    return Math.min(A,Ak)-Math.min(B,Bk); }).slice(0,4);
  h += '<div class="card"><div class="hd"><h3>Lo siguiente que toca</h3>'+
       '<button class="act" data-go="taller">Ver plan</button></div>';
  if(!ven.length){
    h += '<div class="blank"><div class="big">Nada apuntado todavía</div>'+
         '<p>Registra un cambio de aceite, la ITV o el seguro y aquí te aviso cuando vuelvan a tocar.</p>'+
         '<button class="btn gh" data-nuevo="mant">Anotar mantenimiento</button></div>';
  } else {
    ven.forEach(p=>{
      let s = [];
      if(p.dDias!=null) s.push(p.dDias<0 ? ('vencido hace '+Math.abs(p.dDias)+' d') : ('en '+p.dDias+' días'));
      if(p.dKm!=null) s.push(p.dKm<0 ? ('pasado '+num(Math.abs(p.dKm))+' km') : ('en '+num(p.dKm)+' km'));
      h += '<div class="row"><div class="ic">'+ico(p.id==='itv'?'check':p.id==='seguro'?'shield':p.id==='ruedas'?'tyre':'wrench')+'</div>'+
        '<div class="main"><div class="t">'+esc(p.n)+'</div><div class="s">'+s.join(' · ')+'</div>'+
        '<div class="bar"><i class="'+(p.est==='bad'?'bad':p.est==='warn'?'warn':'')+'" style="width:'+(p.pc||0).toFixed(0)+'%"></i></div></div>'+
        '</div>';
    });
  }
  h += '</div>';

  /* grafica de consumo */

/* calculadora de trayecto: se engancha despues de pintar el cuadro */
function pintarTrayecto(){
  const inp = document.getElementById('trKm');
  if(!inp) return;
  const sel = document.getElementById('trIV'), out = document.getElementById('trOut');
  const l = pondL(consumos().slice(-5)), p = precioRef();
  const upd = ()=>{
    const km = (n2(inp.value)||0) * Number(sel.value||1);
    if(!km || !l){ out.innerHTML = '<div class="note">Escribe los kilómetros o elige un destino.</div>'; return; }
    const lit = l*km/100, eu = lit*p;
    out.innerHTML = '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'+
      '<span class="num accent" style="font-size:34px">'+eur(eu,2)+'</span>'+
      '<span class="dim">'+num(lit,1)+' L · '+num(km)+' km</span></div>'+
      '<div class="note" style="margin-top:2px">A '+num(l,1)+' L/100 km y '+num(p,2)+' €/L de referencia.</div>';
  };
  inp.oninput = upd; sel.onchange = upd;
  document.querySelectorAll('[data-trkm]').forEach(b=>{
    b.onclick = ()=>{
      inp.value = b.dataset.trkm;
      document.querySelectorAll('[data-trkm]').forEach(x=>x.classList.toggle('on', x===b));
      upd();
    };
  });
  upd();
}

let filtroAnio = 'todo';
function vGastos(){
  const todos = mios(DB.gastos);
  const reps = mios(DB.repostajes);
  if(!todos.length && !reps.length) return blank('Sin gastos registrados',
    'Seguro, ITV, revisiones, neumáticos, multas… todo lo que se lleva el coche, en un sitio.',
    'gasto','Añadir gasto');
  const anios = Array.from(new Set(todos.concat(reps).map(g=>g.fecha.slice(0,4)))).sort().reverse();
  const f = g => filtroAnio==='todo' || g.fecha.startsWith(filtroAnio);
  const gs = todos.filter(f).sort((a,b)=> a.fecha<b.fecha?1:-1);
  const rs = reps.filter(f);
  const totalG = gs.reduce((s,g)=>s+(n2(g.importe)||0),0);
  const totalC = rs.reduce((s,g)=>s+(n2(g.total)||0),0);

  let h = '<div class="chips"><button class="chip'+(filtroAnio==='todo'?' on':'')+'" data-anio="todo">Todo</button>'+
    anios.map(a=>'<button class="chip'+(filtroAnio===a?' on':'')+'" data-anio="'+a+'">'+a+'</button>').join('')+'</div>';

  const meses = (filtroAnio==='todo') ? null : 12;
  h += '<div class="cluster">'+
    cell('Total', num(totalG+totalC,0),'€', filtroAnio==='todo'?'todo el histórico':'en '+filtroAnio, true)+
    cell('Combustible', num(totalC,0),'€', rs.length+' repostajes')+
    cell('Resto', num(totalG,0),'€', gs.length+' apuntes')+
    cell('Media mes', meses?num((totalG+totalC)/meses,0):'—','€', meses?'sobre 12 meses':'elige un año')+
  '</div>';

  const porCat = {};
  gs.forEach(g=>{ porCat[g.cat] = (porCat[g.cat]||0) + (n2(g.importe)||0); });
  const items = Object.keys(porCat).map(k=>({n:catN(k),v:porCat[k]})).sort((a,b)=>b.v-a.v);
  if(totalC>0) items.push({n:'Combustible',v:totalC});
  items.sort((a,b)=>b.v-a.v);
  if(items.length) h += '<div class="card"><div class="hd"><h3>En qué se va</h3></div>'+barras(items)+'</div>';

  h += '<div class="card"><div class="hd"><h3>Apuntes</h3></div>';
  if(!gs.length) h += '<div class="note">No hay gastos en este periodo. El combustible se registra en la pestaña Repostajes.</div>';
  gs.forEach(g=>{
    h += fila({f:g.fecha, t:g.concepto||catN(g.cat), s:catN(g.cat)+(g.km?' · '+num(n2(g.km))+' km':''),
      v:n2(g.importe), i:(CATS.find(c=>c.k===g.cat)||{i:'square'}).i, tipo:'gasto', id:g.id});
  });
  h += '</div>';
  return h;
}

const CARB = [['d','Gasóleo A'],['dp','Gasóleo premium'],['g95','Gasolina 95'],['g98','Gasolina 98']];
let GAS = null;           // datos de la provincia cargada
let GASIDX = null;        // indice de provincias disponibles
let gasProv = null;       // provincia que se esta mostrando
let gasAviso = '';        // aviso cuando no hay datos de tu zona

let gasCarb = 'd';
let gasRadio = 10;
let gasOrden = 'precio';
let gasPos = null;        // {lat,lon} del usuario
let gasMapa = null;

function distKm(a, b, c, d){
  const R = 6371, r = x => x*Math.PI/180;
  const dLat = r(c-a), dLon = r(d-b);
  const s = Math.sin(dLat/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

/* estaciones que venden el carburante elegido, con distancia, ya filtradas */
function gasCerca(){
  if(!GAS || !GAS.e) return [];
  const o = gasPos;
  return GAS.e
    .filter(e => e.p && e.p[gasCarb] != null)
    .map(e => Object.assign({}, e, {km: o ? distKm(o.lat,o.lon,e.lat,e.lon) : null}))
    .filter(e => !o || gasFuera || e.km <= gasRadio)
    .sort((a,b) => gasOrden==='dist' && o ? a.km-b.km : (a.p[gasCarb]-b.p[gasCarb]));
}

        '<div class="s">'+esc(e.m)+(e.km!=null?' · '+num(e.km,1)+' km':'')+'</div></div>'+
        '<div class="amt" style="color:'+col+'">'+num(p,3)+'<em>€/L</em></div></div>';

function pintarMapa(lista, barato, caro){
  const div = document.getElementById('gasMapa');
  if(!div || !lista.length) return;
  cargarLeaflet().then(ok=>{
    if(!ok || !document.getElementById('gasMapa')) return;
    if(gasMapa){ try{ gasMapa.remove(); }catch(e){} gasMapa = null; }
    const centro = gasPos ? [gasPos.lat, gasPos.lon] : [lista[0].lat, lista[0].lon];
    gasMapa = L.map(div, {zoomControl:false, attributionControl:true}).setView(centro, gasRadio<=10?12:10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(gasMapa);
    const t1 = barato + (caro-barato)/3, t2 = barato + 2*(caro-barato)/3;
    const grupo = [];
    lista.forEach((e,i)=>{
      const p = e.p[gasCarb];
      const cls = p<=t1 ? 'ok' : p<=t2 ? 'warn' : 'bad';
      const m = L.marker([e.lat,e.lon], {icon: L.divIcon({
        className:'', html:'<div class="pin '+cls+'">'+num(p,3)+'</div>',
        iconSize:[46,20], iconAnchor:[23,10]
      })}).addTo(gasMapa);
      m.on('click', ()=>verGasolinera(e));
      grupo.push([e.lat,e.lon]);
    });
    if(gasPos){
      L.circleMarker([gasPos.lat,gasPos.lon], {radius:6, color:'#fff', weight:2,
        fillColor:'#5B8FC7', fillOpacity:1}).addTo(gasMapa);
      grupo.push([gasPos.lat,gasPos.lon]);
    }
    if(grupo.length>1){ try{ gasMapa.fitBounds(grupo,{padding:[28,28],maxZoom:13}); }catch(e){} }
  });
}

function cargarLeaflet(){
  if(window.L) return Promise.resolve(true);
  if(window._lp) return window._lp;
  window._lp = new Promise(res=>{
    const css = document.createElement('link');
    css.rel='stylesheet'; css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    s.onload=()=>res(true); s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
  return window._lp;
}

let gasReloj = null;
function ubicar(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lon:p.coords.longitude}),
      () => res(null), {timeout:9000, maximumAge:60000});
  });
}

/* la provincia cuya caja contiene tu posicion; si ninguna, la mas cercana */
function elegirProvincia(pos){
  const ps = (GASIDX && GASIDX.provincias) || [];
  if(!ps.length) return null;
  if(!pos) return ps[0];
  const dentro = ps.find(p => pos.lat>=p.min[0] && pos.lat<=p.max[0] &&
                              pos.lon>=p.min[1] && pos.lon<=p.max[1]);
  if(dentro) return dentro;
  return ps.slice().sort((a,b)=> distKm(pos.lat,pos.lon,a.lat,a.lon) -
                                 distKm(pos.lat,pos.lon,b.lat,b.lon))[0];
}

function cargarGas(recargar, forzar){
  gasEstado = 'cargando'; gasAviso = '';
  clearTimeout(gasReloj);
  gasReloj = setTimeout(()=>{
    if(gasEstado === 'cargando'){ gasEstado = 'error'; if(vista==='precios') pintarPrecios(); }
  }, 20000);

  const cb = recargar ? ('?t='+Date.now()) : '';
  const opc = {cache: recargar ? 'reload' : 'default'};
  const pedir = ruta => fetch('datos/'+ruta+cb, opc)
    .then(r => r.ok ? r.json() : Promise.reject('HTTP '+r.status));

  const pIdx = (GASIDX && !recargar) ? Promise.resolve(GASIDX)
             : pedir('indice.json').then(j => (GASIDX = j)).catch(()=>null);
  /* al recargar volvemos a preguntar donde estas: si te has movido, cambia todo */
  const pPos = (gasPos && !recargar && !forzar) ? Promise.resolve(gasPos)
             : ubicar().then(p => (gasPos = p || gasPos));

  function listo(){
    clearTimeout(gasReloj); gasEstado = 'ok';
    if(vista==='precios') pintarPrecios();
  }

  Promise.all([pIdx, pPos]).then(([idx, pos])=>{
    let prov = null;
    if(idx && idx.provincias && idx.provincias.length){
      prov = forzar ? idx.provincias.find(p => p.id === forzar) : null;
      if(!prov) prov = elegirProvincia(pos);
    }
    if(!prov){
      // sin indice, caemos al archivo unico de siempre
      return pedir('gasolineras.json').then(j => { GAS = j; gasProv = null; listo(); });
    }
    gasFuera = !!(pos && !(pos.lat>=prov.min[0] && pos.lat<=prov.max[0] &&
                           pos.lon>=prov.min[1] && pos.lon<=prov.max[1]));
    if(gasFuera && !forzar){
      gasAviso = 'No tengo precios de donde estás. Te enseño ' + prov.n + '.';
    }
    return pedir(prov.archivo).then(j => { GAS = j; gasProv = prov; listo(); });
  }).catch(e => {
    clearTimeout(gasReloj); console.warn('precios:', e);
    gasEstado = 'error'; if(vista==='precios') pintarPrecios();
  });

  if(vista==='precios') pintarPrecios();
}

function campo(k,l,tipo,val,extra){
  tipo = tipo||'text'; val = val==null?'':val;
  let inp;
  if(tipo==='area') inp = '<textarea data-k="'+k+'">'+esc(val)+'</textarea>';
  else if(tipo==='select') inp = '<select data-k="'+k+'">'+extra.map(o=>
      '<option value="'+esc(o[0])+'"'+(String(val)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
  else if(tipo==='check') inp = '<label style="display:flex;gap:9px;align-items:center;padding:9px 0"><input type="checkbox" data-k="'+k+'" '+
      (val?'checked':'')+' style="width:20px;height:20px;accent-color:var(--accent)"><span>'+esc(extra||'Si')+'</span></label>';
  else inp = '<input data-k="'+k+'" type="'+tipo+'" value="'+esc(val)+'"'+
      (tipo==='number'?' inputmode="decimal" step="any"':'')+(extra?' placeholder="'+esc(extra)+'"':'')+'>';
  if(tipo==='check') return '<div style="margin-bottom:8px">'+inp+'</div>';
  return '<label class="f"><span class="l">'+esc(l)+'</span>'+inp+'</label>';
}
function leer(){
  const o = {};
  document.querySelectorAll('#sheetBody [data-k]').forEach(el=>{
    o[el.dataset.k] = el.type==='checkbox' ? el.checked : el.value.trim();
  });
  return o;
}

function formRepostaje(id, pre){
  const r = id ? DB.repostajes.find(x=>x.id===id)
              : Object.assign({fecha:hoy(), lleno:true}, pre||{});
  abrir(id?'Repostaje':'Nuevo repostaje',
    '<div class="grid2">'+campo('fecha','Fecha','date',r.fecha)+
    campo('total','Importe (€)','number',r.total)+'</div>'+
    campo('trip','Km recorridos','number',r.trip,'los del cuentakilómetros parcial')+
    '<div class="note" style="margin:-4px 0 14px">Con esto tres ya te calculo el consumo, estimando los litros a '+
    num(precioRef(),2)+' €/L. Lo cambias en Ajustes.</div>'+
    '<div class="sep"></div><div class="eyebrow" style="margin-bottom:10px">Si lo sabes</div>'+
    '<div class="grid2">'+campo('litros','Litros','number',r.litros)+
    campo('precioL','Precio por litro (€)','number',r.precioL)+'</div>'+
    campo('km','Odómetro (km totales)','number',r.km,num(kmActual()||0))+
    campo('estacion','Gasolinera','text',r.estacion,'Repsol A-49')+
    campo('lleno','','check',r.lleno===undefined?true:r.lleno,'Depósito lleno hasta arriba')+
    campo('notas','Notas','area',r.notas)+
    acciones(id));
  wire(()=>{
    const d = leer();
    let L=n2(d.litros), P=n2(d.precioL), T=n2(d.total);
    if(L&&P&&!T) T = L*P; if(L&&T&&!P) P = T/L; if(P&&T&&!L) L = T/P;
    if(!d.fecha || (!T && !L)){ toast('Necesito la fecha y el importe (o los litros)'); return; }
    const obj = Object.assign({}, d, {litros:L?L.toFixed(2):'', precioL:P?P.toFixed(3):'',
      total:T?T.toFixed(2):'', id:id||uid(), cid:DB.activo});
    if(id) DB.repostajes[DB.repostajes.findIndex(x=>x.id===id)] = obj; else DB.repostajes.push(obj);
    guardar(); cerrar(); render(); toast(id?'Repostaje actualizado':'Repostaje guardado');
  }, ()=>{ DB.repostajes = DB.repostajes.filter(x=>x.id!==id); guardar(); cerrar(); render(); toast('Eliminado'); });
}

/* --- enlaces para Atajos de iOS --- */
function deepLink(){
  const h = location.hash.replace(/^#/,'');
  if(!h) return;
  const p = {};
  h.split('&').forEach(kv=>{ const i = kv.indexOf('=');
    if(i>0) p[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' ')); });
  history.replaceState(null,'',location.pathname+location.search);
  const pre = {};
  /* Atajos puede mandar los km como "1.030": quitamos el separador de miles */
  const limpia = (v,entero) => {
    v = String(v).replace(/\s|\u00a0/g,'');
    return entero ? v.replace(/[.\u2024]/g,'') : v;
  };
  ['total','litros','precioL','estacion','cat','concepto','fecha','notas']
    .forEach(k=>{ if(p[k]) pre[k] = limpia(p[k],false); });
  ['trip','km','importe'].forEach(k=>{ if(p[k]) pre[k] = limpia(p[k], k!=='importe'); });
  if(!pre.fecha) pre.fecha = hoy();
  if(p.nuevo==='rep' || p.nuevo==='repostaje'){ ir('repostajes'); setTimeout(()=>formRepostaje(null,pre),80); }
  else if(p.nuevo==='gasto'){ ir('gastos'); setTimeout(()=>formGasto(null,pre),80); }
}

/* --- fotos de documentos (IndexedDB) --- */
const TIPOS_DOC = [['ficha','Ficha técnica'],['permiso','Permiso de circulación'],['itv','Tarjeta ITV'],
  ['seguro','Seguro'],['factura','Factura'],['otro','Otro']];
let _idb = null, _urls = [];
function idb(){
  return new Promise((res,rej)=>{
    if(_idb) return res(_idb);
    if(!('indexedDB' in window)) return rej(new Error('sin indexedDB'));
    const q = indexedDB.open('garaje-docs',1);
    q.onupgradeneeded = ()=>{ const d=q.result;
      if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs',{keyPath:'id'}); };
    q.onsuccess = ()=>{ _idb=q.result; res(_idb); };
    q.onerror = ()=>rej(q.error);
  });
}
function docsTodos(){
  return idb().then(d=>new Promise((res,rej)=>{
    const t = d.transaction('docs','readonly'), r = t.objectStore('docs').getAll();
    r.onsuccess = ()=>res((r.result||[]).filter(x=>x.cid===DB.activo).sort((a,b)=>a.fecha<b.fecha?1:-1));
    r.onerror = ()=>rej(r.error);
  }));
}
function docGuardar(o){
  return idb().then(d=>new Promise((res,rej)=>{
    const t = d.transaction('docs','readwrite'); t.objectStore('docs').put(o);
    t.oncomplete = ()=>res(); t.onerror = ()=>rej(t.error);
  }));
}
function docBorrar(id){
  return idb().then(d=>new Promise((res,rej)=>{
    const t = d.transaction('docs','readwrite'); t.objectStore('docs').delete(id);
    t.oncomplete = ()=>res(); t.onerror = ()=>rej(t.error);
  }));
}
/* reduce la foto antes de guardarla: 1600 px de lado mayor */
function comprimir(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const s = Math.min(1, 1600/Math.max(img.width,img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(b=> b?res(b):rej(new Error('sin blob')), 'image/jpeg', 0.82);
      };
      img.onerror = ()=>rej(new Error('no es una imagen'));
      img.src = fr.result;
    };
    fr.onerror = ()=>rej(fr.error);
    fr.readAsDataURL(file);
  });
}
function pintarDocs(){
  const cont = document.getElementById('docsGrid');
  if(!cont) return;
  _urls.forEach(u=>URL.revokeObjectURL(u)); _urls = [];
  docsTodos().then(ds=>{
    if(!ds.length){ cont.innerHTML = '<div class="note">Ficha técnica, permiso de circulación, tarjeta de la ITV, '+
      'facturas del taller. Se quedan en el móvil, no se suben a ningún sitio.</div>'; return; }
    cont.innerHTML = '<div class="docs">'+ds.map(d=>{
      const u = URL.createObjectURL(d.blob); _urls.push(u);
      const t = (TIPOS_DOC.find(x=>x[0]===d.tipo)||['','Otro'])[1];
      return '<button class="doc" data-doc="'+d.id+'"><img src="'+u+'" alt="'+esc(d.titulo||t)+'" loading="lazy">'+
        '<span>'+esc(d.titulo||t)+'</span></button>';
    }).join('')+'</div>';
  }).catch(()=>{ cont.innerHTML = '<div class="note">Este navegador no deja guardar fotos.</div>'; });
}
function anadirDoc(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    toast('Procesando la foto…');
    comprimir(f).then(blob=>{
      const id = uid();
      return docGuardar({id, cid:DB.activo, tipo:'otro', titulo:'', fecha:hoy(), blob, tam:blob.size})
        .then(()=>{ pintarDocs(); setTimeout(()=>verDoc(id),150); });
    }).catch(()=>toast('No he podido leer esa imagen'));
  };
  inp.click();
}
function verDoc(id){
  docsTodos().then(ds=>{
    const d = ds.find(x=>x.id===id); if(!d) return;
    const u = URL.createObjectURL(d.blob); _urls.push(u);
    abrir('Documento',
      '<img src="'+u+'" alt="" style="width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px">'+
      campo('tipo','Qué es','select',d.tipo,TIPOS_DOC)+
      campo('titulo','Nombre','text',d.titulo,'Factura embrague')+
      campo('fecha','Fecha','date',d.fecha)+
      '<div class="note" style="margin-bottom:12px">'+Math.round(d.tam/1024)+' KB. '+
      'Las fotos no entran en la copia de seguridad: si cambias de móvil, descárgatelas antes.</div>'+
      '<div class="btnrow"><button class="btn pri" id="okBtn">Guardar</button></div>'+
      '<div class="btnrow"><button class="btn gh" id="bajaBtn">Descargar</button>'+
      '<button class="btn dan" id="delBtn">Eliminar</button></div>');
    document.getElementById('bajaBtn').onclick = ()=>{
      const a = document.createElement('a'); a.href=u;
      a.download = (d.titulo||d.tipo||'documento')+'.jpg'; a.click();
    };
    wire(()=>{
      const v = leer();
      docGuardar(Object.assign({}, d, {tipo:v.tipo, titulo:v.titulo, fecha:v.fecha}))
        .then(()=>{ cerrar(); pintarDocs(); toast('Guardado'); });
    }, ()=>{ docBorrar(id).then(()=>{ cerrar(); pintarDocs(); toast('Eliminado'); }); });
  });
}

/* vencimientos al calendario: iOS no deja programar avisos desde una web,
   asi que generamos un .ics y que avise Calendario */
function calendario(){
  const c = coche(), st = estadoPlan().filter(p=>p.prox);
  if(!st.length){ toast('Todavía no hay vencimientos con fecha'); return; }
  const pad = n => String(n).padStart(2,'0');
  const d = new Date();
  const sello = d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
                pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
  const lim = s => String(s).replace(/([,;\\])/g,'\\$1').replace(/\r?\n/g,' ');
  const nom = c.alias || c.modelo || 'el coche';
  let L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Garaje//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  st.forEach(p=>{
    const ini = p.prox.replace(/-/g,'');
    const x = new Date(p.prox+'T12:00'); x.setDate(x.getDate()+1);
    const fin = x.toISOString().slice(0,10).replace(/-/g,'');
    L = L.concat(['BEGIN:VEVENT',
      'UID:garaje-'+p.id+'-'+ini+'@garaje',
      'DTSTAMP:'+sello,
      'DTSTART;VALUE=DATE:'+ini,
      'DTEND;VALUE=DATE:'+fin,
      'SUMMARY:'+lim(p.n+' - '+nom),
      'DESCRIPTION:'+lim('Última vez: '+(p.uf?fFecha(p.uf):'sin registrar')+
        (p.proxKm?'. Toca a los '+num(p.proxKm)+' km':'')),
      'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+lim(p.n),'END:VALARM',
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+lim(p.n),'END:VALARM',
      'END:VEVENT']);
  });
  L.push('END:VCALENDAR');
  const blob = new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'garaje-vencimientos.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(st.length+' vencimientos listos para Calendario');
}

function importar(csv){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept = csv?'.csv,text/csv':'application/json,.json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        if(csv){ importarCSV(fr.result); }
        else{
          const d = JSON.parse(fr.result);
          if(!d.coches) throw new Error('formato');
          if(!confirm('Esto sustituye todo lo que tienes ahora. ¿Seguir?')) return;
          DB = d; if(!DB.activo) DB.activo = DB.coches[0].id;
        }
        guardar(); cerrar(); render(); aplicarTema(); toast('Importado');
      }catch(e){ toast('El archivo no tiene el formato esperado'); }
    };
    fr.readAsText(f,'utf-8');
  };
  inp.click();
}
/* CSV: fecha;km;litros;precio;total  (acepta , o ; y cabecera) */
function importarCSV(txt){
  const lineas = txt.split(/\r?\n/).filter(l=>l.trim());
  const sep = (lineas[0].match(/;/g)||[]).length >= (lineas[0].match(/,/g)||[]).length ? ';' : ',';
  let n = 0;
  lineas.forEach((l,i)=>{
    const p = l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''));
    if(i===0 && !/^\d/.test(p[0])) return;
    let f = p[0];
    if(/^\d{2}[\/\-]\d{2}[\/\-]\d{4}$/.test(f)){ const q=f.split(/[\/\-]/); f = q[2]+'-'+q[1]+'-'+q[0]; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(f)) return;
    const litros = n2(p[2]), total = n2(p[4]), trip = n2(p[5]);
    if(!litros && !total) return;
    DB.repostajes.push({id:uid(), cid:DB.activo, fecha:f, km:p[1]||'', litros:litros||'',
      precioL:n2(p[3])||'', total:total||'', trip:trip||'', lleno:true, estacion:p[6]||'', notas:''});
    n++;
  });
  if(!n) throw new Error('vacio');
  toast(n+' repostajes importados');
}

  if(t === document.documentElement || t === document.body) return;
  const nuevo = t.closest('[data-nuevo]');
  if(nuevo){ const k=nuevo.dataset.nuevo;
    if(k==='rep') formRepostaje(); else if(k==='gasto') formGasto();
    else if(k==='mant') formMant(); else if(k==='averia') formAveria(); return; }
  const ed = t.closest('[data-edit]');
  if(ed){ const k=ed.dataset.edit, id=ed.dataset.id;
    if(k==='rep') formRepostaje(id); else if(k==='gasto') formGasto(id);
    else if(k==='mant') formMant(id); else if(k==='averia') formAveria(id); return; }
  const gp = t.closest('[data-grupo]'); if(gp){ formGrupo(+gp.dataset.grupo); return; }
  const pl = t.closest('[data-plan]'); if(pl){ verPlan(pl.dataset.plan); return; }
  const go = t.closest('[data-go]'); if(go){ ir(go.dataset.go); return; }
  const an = t.closest('[data-anio]'); if(an){ filtroAnio = an.dataset.anio; render(); return; }
  const tm = t.closest('[data-fijartema]');
  if(tm){ DB.tema = tm.dataset.fijartema; guardar(); aplicarTema();
    document.querySelectorAll('[data-fijartema]').forEach(x=>x.classList.toggle('on', x.dataset.fijartema===DB.tema));
    return; }
  const co = t.closest('[data-coche]'); if(co){ DB.activo = co.dataset.coche; guardar(); cerrar(); render(); return; }
  const dc = t.closest('[data-doc]'); if(dc){ verDoc(dc.dataset.doc); return; }
  const cb = t.closest('[data-carb]');
  if(cb){ gasCarb = cb.dataset.carb;
    document.querySelectorAll('[data-carb]').forEach(x=>x.classList.toggle('on', x===cb));
    pintarPrecios(); return; }
  const gs = t.closest('[data-gas]');
  if(gs){ const e = gasCerca()[+gs.dataset.gas]; if(e) verGasolinera(e); return; }
  const ac = t.closest('[data-accion]');
  if(ac && ac.dataset.accion==='presiones'){
    DB.mantenimientos.push({id:uid(), cid:DB.activo, tipo:'presiones', fecha:hoy(),
      km:kmActual()||'', concepto:'Presiones revisadas', importe:'', taller:'', notas:''});
    guardar(); render(); toast('Presiones revisadas hoy'); return;
  }
  if(t.closest('#pedirOdo')){ formOdometro(); return; }
  if(t.id==='editPlan'){ formPlan(); return; }
});
window.addEventListener('hashchange', deepLink);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') cerrar(); });

aplicarTema(); render(); deepLink();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
